[project]
name = "betbot"
version = "0.1.0"
description = "Telegram Dota 2 analysis, market comparison and immutable prediction ledger"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.20,<4",
  "aiohttp-socks>=0.10,<1",
  "httpx[socks]>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
betbot = "betbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
