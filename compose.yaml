services:
  betbot:
    build: .
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "betbot.runtime", "health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
